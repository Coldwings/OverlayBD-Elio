# CI for overlaybd-elio.
#
# Four jobs mirroring the local verify-trio (AGENTS.md):
#   build-test      — default configure, build, ctest. The default converter
#                     build enables the pinned libe2fs backend and includes the
#                     install-time runtime-library path check.
#   build-test-builtin-converter — dependency-free converter build with
#                     OBD_ENABLE_LIBE2FS_BACKEND=OFF, covering the explicit
#                     builtin-ext2 fallback path.
#   build-test-ublk-privileged — loads ublk_drv (GitHub-hosted runners are
#                     full VMs; module loading works) and runs ONLY the
#                     [ublk]-tagged E2E tests under sudo. Everything else
#                     is already covered unprivileged by build-test.
#   docs governance — the documentation floor checks (scripts/check-docs.sh).
# FetchContent (Elio, nlohmann/json, lz4, zstd, Catch2) needs network on
# first configure, which GitHub-hosted runners provide.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger (also lets a branch head be verified
                      # when the pull_request event does not schedule a run)

jobs:
  build-test:
    name: build-test
    # ubuntu-latest (24.04): GCC 13, kernel headers >= 6.x with
    # <linux/ublk_cmd.h>, recent liburing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The GitHub runner image ships a google-chrome apt source whose index
          # intermittently Hash-mismatches on dl.google.com (issue #37); the
          # build never needs Chrome, so drop the source before updating.
          # rm the known file names AND delete any dl.google.com line from
          # every apt source (the exact path varies across runner images).
          sudo rm -f /etc/apt/sources.list.d/google-chrome* \
            /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          # .list AND deb822 .sources variants; the runner path varies.
          sudo sed -i '/dl\.google\.com/d' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liburing-dev zlib1g-dev libssl-dev cmake ninja-build build-essential

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DOBD_BUILD_TESTS=ON
          -DOBD_BUILD_BENCHMARKS=ON
          -DOBD_ENABLE_UBLK=ON
          -DOBD_ENABLE_LIBE2FS_BACKEND=ON
          -DOBD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        # Privileged ublk E2E tests self-skip on unprivileged runners —
        # intentionally not run under sudo (AGENTS.md).
        run: ctest --test-dir build --output-on-failure

  build-test-builtin-converter:
    name: build-test (builtin converter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The GitHub runner image ships a google-chrome apt source whose index
          # intermittently Hash-mismatches on dl.google.com (issue #37); the
          # build never needs Chrome, so drop the source before updating.
          # rm the known file names AND delete any dl.google.com line from
          # every apt source (the exact path varies across runner images).
          sudo rm -f /etc/apt/sources.list.d/google-chrome* \
            /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          # .list AND deb822 .sources variants; the runner path varies.
          sudo sed -i '/dl\.google\.com/d' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liburing-dev zlib1g-dev libssl-dev cmake ninja-build g++

      - name: Configure
        run: >
          cmake -S . -B build-builtin -G Ninja
          -DOBD_BUILD_TESTS=ON
          -DOBD_BUILD_BENCHMARKS=OFF
          -DOBD_ENABLE_UBLK=OFF
          -DOBD_ENABLE_LIBE2FS_BACKEND=OFF
          -DOBD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-builtin -j"$(nproc)"

      - name: Test converter and source guards
        run: >
          ctest --test-dir build-builtin --output-on-failure
          -R 'obd-convert|test-await|ctest-timeout|build-warning-coverage'

  build-test-ublk-privileged:
    name: build-test (ublk E2E, privileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The GitHub runner image ships a google-chrome apt source whose index
          # intermittently Hash-mismatches on dl.google.com (issue #37); the
          # build never needs Chrome, so drop the source before updating.
          # rm the known file names AND delete any dl.google.com line from
          # every apt source (the exact path varies across runner images).
          sudo rm -f /etc/apt/sources.list.d/google-chrome* \
            /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          # .list AND deb822 .sources variants; the runner path varies.
          sudo sed -i '/dl\.google\.com/d' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liburing-dev zlib1g-dev libssl-dev linux-libc-dev \
            cmake ninja-build g++

      - name: Select ublk driver source release
        id: ublk-kernel
        run: |
          release="$(uname -r | cut -d. -f1-2)"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache ublk driver release source
        uses: actions/cache@v4
        with:
          path: /tmp/ublk-source/linux-${{ steps.ublk-kernel.outputs.release }}
          key: ublk-mainline-release-source-v1-${{ steps.ublk-kernel.outputs.release }}

      - name: Build and load ublk_drv
        # Ubuntu kernels do not ship ublk_drv (CONFIG_BLK_DEV_UBLK=n in
        # every noble package), so modprobe alone cannot work. Build the
        # driver out-of-tree against the running kernel's headers from
        # the matching mainline source, then insmod it. GitHub-hosted
        # runners are full VMs: module loading works (no Secure Boot).
        run: |
          set -e
          # The GitHub runner image ships a google-chrome apt source whose index
          # intermittently Hash-mismatches on dl.google.com (issue #37); the
          # build never needs Chrome, so drop the source before updating.
          # rm the known file names AND delete any dl.google.com line from
          # every apt source (the exact path varies across runner images).
          sudo rm -f /etc/apt/sources.list.d/google-chrome* \
            /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          # .list AND deb822 .sources variants; the runner path varies.
          sudo sed -i '/dl\.google\.com/d' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "linux-headers-$(uname -r)" build-essential libelf-dev dwarves xz-utils
          kbase="$(uname -r | cut -d. -f1-2)"
          timeout --kill-after=5s 300s bash scripts/fetch-ublk-driver.sh "$kbase" /tmp/ublk-source
          mkdir -p /tmp/ublk && cd /tmp/ublk
          cp "/tmp/ublk-source/linux-$kbase/ublk_drv.c" ublk_drv.c
          echo 'obj-m += ublk_drv.o' > Makefile
          make -C "/lib/modules/$(uname -r)/build" M=/tmp/ublk modules
          sudo insmod /tmp/ublk/ublk_drv.ko
          ls -l /dev/ublk-control

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DOBD_BUILD_TESTS=ON
          -DOBD_BUILD_BENCHMARKS=OFF
          -DOBD_ENABLE_UBLK=ON
          -DOBD_ENABLE_LIBE2FS_BACKEND=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # One step per E2E test: a wedged kernel handshake must fail fast
      # AND localize. Stage logs ([e2e-stage]) stream live in the log.
      - name: "E2E - block device reads"
        timeout-minutes: 5
        run: |
          trap 'rc=$?; echo "ublk reads: exit=$rc" | tee -a build/ublk-e2e-read.log' EXIT
          sudo -E ./build/tests/obd_integration_tests \
            "integration: ublk device serves sector reads from a blob" -s \
            > >(tee build/ublk-e2e-read.log) 2>&1 &
          TESTPID=$!
          # Poll instead of a fixed sleep: fast when the test is fast,
          # still dumps kernel stacks for every thread if it hangs.
          for i in $(seq 1 45); do
            kill -0 $TESTPID 2>/dev/null || break
            sleep 1
          done
          if kill -0 $TESTPID 2>/dev/null; then
            CHILD=$(pgrep -P $TESTPID | head -1)
            echo "=== test still running after 45s (sudo=$TESTPID child=$CHILD)"
            for t in /proc/$CHILD/task/*; do
              echo "--- tid ${t##*/} ($(cat $t/comm)) wchan=$(cat $t/wchan)"
              sudo cat $t/stack 2>/dev/null || true
            done
            sudo kill -9 $CHILD $TESTPID
            exit 1
          fi
          wait $TESTPID

      - name: "E2E - two queues over remote LSMT"
        timeout-minutes: 5
        run: |
          set -o pipefail
          log=build/ublk-e2e-remote-lsmt.log
          printf 'ublk remote LSMT: head=%s kernel=%s\n' "$GITHUB_SHA" "$(uname -r)" | tee "$log"
          set +e
          timeout -s KILL 120 sudo -E ./build/tests/obd_integration_tests \
            "integration: two ublk queues reuse tags over slow remote LSMT reads" \
            -s --colour-mode none 2>&1 | tee -a "$log"
          statuses=("${PIPESTATUS[@]}")
          printf 'ublk remote LSMT: command exit=%s tee exit=%s\n' \
            "${statuses[0]}" "${statuses[1]}" | tee -a "$log"
          logging_status=$?
          set -e
          if (( statuses[1] != 0 || logging_status != 0 )); then
            echo '::error::ublk remote LSMT: failed to preserve the test log'
            if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
            if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi
            exit "$logging_status"
          fi
          if (( statuses[0] == 4 )) &&
             grep -Fq 'two kernel queues lack distinct allowed client CPUs' "$log"; then
            echo '::warning::ublk remote LSMT: SKIP - no usable two-queue CPU map; multi-queue coverage was not exercised' \
              | tee -a "$log"
          elif (( statuses[0] != 0 )); then
            echo "::error::ublk remote LSMT: failed or unexpected skip (exit=${statuses[0]})"
            exit "${statuses[0]}"
          else
            echo 'ublk remote LSMT: PASS - both queue cohorts, HTTP reads, source EIO and tag reuse verified' \
              | tee -a "$log"
          fi

      - name: "E2E - writes and discard"
        timeout-minutes: 5
        run: |
          set -o pipefail
          trap 'rc=$?; echo "ublk writes/discard: exit=$rc" | tee -a build/ublk-e2e-write.log' EXIT
          timeout -s KILL 120 sudo -E ./build/tests/obd_integration_tests \
            "integration: ublk writable device serves writes and discard" -s \
            2>&1 | tee build/ublk-e2e-write.log

      - name: "E2E - USER_RECOVERY handshake"
        timeout-minutes: 5
        run: |
          set -o pipefail
          trap 'rc=$?; echo "ublk recovery: exit=$rc" | tee -a build/ublk-e2e-recovery.log' EXIT
          timeout -s KILL 120 sudo -E ./build/tests/obd_integration_tests \
            "integration: ublk device survives server death via USER_RECOVERY" -s \
            2>&1 | tee build/ublk-e2e-recovery.log

      - name: "E2E - online grow"
        timeout-minutes: 5
        run: |
          set -o pipefail
          log=build/ublk-e2e-grow.log
          printf 'ublk grow: head=%s kernel=%s\n' "$GITHUB_SHA" "$(uname -r)" | tee "$log"
          # Capture both statuses before errexit handles the pipeline. Catch2
          # returns 4 for ANY all-skipped selection, including missing control.
          set +e
          timeout -s KILL 120 sudo -E ./build/tests/obd_integration_tests \
            "integration: ublk device grows online and serves the new capacity" \
            -s --colour-mode none 2>&1 | tee -a "$log"
          statuses=("${PIPESTATUS[@]}")
          printf 'ublk grow: command exit=%s tee exit=%s\n' \
            "${statuses[0]}" "${statuses[1]}" | tee -a "$log"
          logging_status=$?
          set -e
          # A broken log cannot establish the reason for a skip. Preserve a
          # failing test status first, otherwise propagate the logging failure.
          if (( statuses[1] != 0 || logging_status != 0 )); then
            echo '::error::ublk grow: failed to preserve the test log'
            if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
            if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi
            exit "$logging_status"
          fi
          if (( statuses[0] == 4 )) &&
             grep -Fq 'kernel driver lacks UBLK_U_CMD_UPDATE_SIZE' "$log"; then
            echo '::warning::ublk grow: SKIP - driver lacks UPDATE_SIZE; supported-grow coverage was not exercised' \
              | tee -a "$log"
          elif (( statuses[0] != 0 )); then
            echo "::error::ublk grow: failed or unexpected skip (exit=${statuses[0]})"
            exit "${statuses[0]}"
          else
            echo 'ublk grow: PASS - capacity, grown-region I/O and original content verified' \
              | tee -a "$log"
          fi

      - name: "E2E - supervisor teardown and ublk removal"
        timeout-minutes: 5
        run: |
          set -o pipefail
          trap 'rc=$?; echo "ublk supervisor teardown: exit=$rc" | tee -a build/ublk-e2e-supervisor.log' EXIT
          timeout -s KILL 120 sudo -E ./build/tests/obd_integration_tests \
            "integration: supervisor reaps children before releasing ublk devices" -s \
            2>&1 | tee build/ublk-e2e-supervisor.log

      - name: "E2E - retained recovery lifecycle"
        timeout-minutes: 11
        run: |
          evidence_root=$(mktemp -d /tmp/obd-ci-XXXXXX)
          printf '%s\n' "$evidence_root" > build/ublk-startup-root
          for scenario in partial source report-retry; do
            log="build/ublk-e2e-startup-$scenario.log"
            if [ "$scenario" = partial ]; then
              selector='integration: supervisor retains failed partial ublk recovery until explicit release'
            elif [ "$scenario" = source ]; then
              selector='integration: adopted ublk recovery drains source frames before explicit release'
            else
              selector='integration: retained ublk caller survives report failure and retries refused release'
            fi
            printf 'ublk retained recovery: scenario=%s head=%s kernel=%s\n' \
              "$scenario" "$GITHUB_SHA" "$(uname -r)" > "$log"
            sudo -E env TMPDIR="$evidence_root" \
              ./build/tests/obd_integration_tests "$selector" \
              -s --colour-mode none >> "$log" 2>&1 &
            TESTPID=$!
            for i in $(seq 1 180); do
              kill -0 "$TESTPID" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$TESTPID" 2>/dev/null; then
              echo 'ublk retained recovery: observation deadline; owners remain retained' | tee -a "$log"
              cat "$log"
              exit 1
            fi
            set +e
            wait "$TESTPID"
            rc=$?
            set -e
            printf 'ublk retained recovery: exit=%s\n' "$rc" | tee -a "$log"
            cat "$log"
            if (( rc == 4 )); then
              echo '::error::retained recovery unexpectedly skipped'
              exit 1
            fi
            if (( rc != 0 )); then exit "$rc"; fi
          done

      - name: Preserve retained-recovery evidence
        if: always()
        run: |
          # A failed observation is diagnostic evidence, never retirement.
          # Capture before the hosted VM is discarded; do not kill its owners.
          if [ -f build/ublk-startup-root ]; then
            read -r evidence_root < build/ublk-startup-root
            sudo tar -czf build/ublk-startup-evidence.tar.gz \
              -C "$evidence_root" .
          fi

      - name: Capture available shutdown diagnostics
        if: failure()
        run: |
          mkdir -p build
          sudo dmesg > build/ublk-e2e-kernel.log 2>&1 || true
          if command -v coredumpctl >/dev/null; then
            sudo coredumpctl --no-pager info obd_integration_tests \
              > build/ublk-e2e-core.log 2>&1 || true
          fi

      - name: Preserve ublk E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ublk-e2e-logs
          path: |
            build/ublk-e2e-*.log
            build/ublk-startup-evidence.tar.gz
          if-no-files-found: ignore

  docs-governance:
    name: docs governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Documentation floor checks
        run: bash scripts/check-docs.sh
