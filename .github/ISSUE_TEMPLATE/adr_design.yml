name: ADR / design proposal
description: Propose a contract, compatibility, architecture, or behavior change that may require an ADR.
title: "[Contract] "
labels: ["enhancement", "documentation"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision needed
      description: State the concrete behavior, compatibility, format, protocol, dependency, or architecture question.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current contract and evidence
      description: Cite current docs, ADRs, implementation, tests, and any contradictions.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: List viable options and trade-offs. Include a recommended option if known.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and migration impact
      description: Identify wire/on-disk/API/CLI behavior, data-plane, build, packaging, or operator impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and acceptance
      description: What tests, docs, ADR updates, and CI coverage should prove the selected design?
    validations:
      required: true
